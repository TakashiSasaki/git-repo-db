[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repo-catalog-context"
version = "0.2.0"
description = "Opt-in Context resource and exact-text reader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["repo-catalog-contracts==0.2.0", "repo-catalog-runtime==0.2.0"]

[tool.hatch.build.targets.sdist]
only-include = ["src/repo_catalog", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_catalog"]

[tool.uv.sources]
repo-catalog-contracts = { workspace = true }
repo-catalog-runtime = { workspace = true }
