[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repo-catalog-worktrees"
version = "0.2.0"
description = "Independent local Git worktree topology catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
repo-catalog-worktrees = "repo_catalog.worktrees.cli:main"

[tool.hatch.build.targets.sdist]
only-include = ["src/repo_catalog", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_catalog"]
