[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repo-catalog"
version = "0.2.0"
description = "Persistent, offline-queryable Git and GitHub pull request catalog"
requires-python = ">=3.12"
dependencies = ["repo-catalog-paired-query==0.2.0", "repo-catalog-access==0.2.0", "repo-catalog-core==0.2.0", "repo-catalog-context==0.2.0", "repo-catalog-contracts==0.2.0", "httpx>=0.28,<1"]

[project.optional-dependencies]
local = ["repo-catalog-local==0.2.0"]

[project.scripts]
repo-catalog = "repo_catalog.cli.main:main"

[dependency-groups]
dev = [
    "repo-catalog-local==0.2.0",
    "pytest>=8,<10",
    "jsonschema>=4.23,<5",
    "hatchling>=1.27,<2",
    "ruff>=0.14,<1",
    "pytest-xdist>=3.8,<4",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/repo_catalog", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/core/src", "packages/contracts/src", "packages/runtime/src", "packages/context/src", "packages/access/src", "packages/paired-query/src", "packages/filesystem/src", "packages/worktrees/src", "packages/local/src"]
addopts = "--strict-markers -m 'not live and not benchmark'"
markers = ["live: opt-in real GitHub requests", "benchmark: opt-in measurements"]

[tool.ruff]
target-version = "py312"
src = [".", "src", "packages/core/src", "packages/contracts/src", "packages/runtime/src", "packages/context/src", "packages/access/src", "packages/paired-query/src", "packages/filesystem/src", "packages/worktrees/src", "packages/local/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.workspace]
members = ["packages/core", "packages/contracts", "packages/runtime", "packages/context", "packages/access", "packages/paired-query", "packages/filesystem", "packages/worktrees", "packages/local"]

[tool.uv.sources]
repo-catalog-core = { workspace = true }
repo-catalog-contracts = { workspace = true }
repo-catalog-context = { workspace = true }
repo-catalog-access = { workspace = true }
repo-catalog-paired-query = { workspace = true }
repo-catalog-filesystem = { workspace = true }
repo-catalog-worktrees = { workspace = true }
repo-catalog-local = { workspace = true }
