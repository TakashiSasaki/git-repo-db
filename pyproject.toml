[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "repo-catalog"
version = "0.1.0"
description = "Persistent, offline-queryable Git and GitHub pull request catalog"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
repo-catalog = "repo_catalog.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "jsonschema>=4.23,<5",
    "hatchling>=1.27,<2",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["live: opt-in real GitHub requests", "benchmark: opt-in measurements"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
