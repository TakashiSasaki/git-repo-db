site_name: git-repo-db Developer Documentation
site_url: https://git-repo-db.moukaeritai.work/
repo_url: https://github.com/TakashiSasaki/git-repo-db
repo_name: TakashiSasaki/git-repo-db
site_description: Persistent, offline-queryable Git and GitHub pull request catalog in SQLite

docs_dir: .build/docs-source
site_dir: site

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list

nav:
  - ホーム: index.md
  - アーキテクチャ:
      - 概要: architecture/index.md
      - Three-Store Boundary: architecture/three-store-boundary.md
  - データベーススキーマ:
      - スキーマ概要: schema/index.md
      - インタラクティブビューアー: /schema/viewer/
      - Mermaid ダイアグラム:
          - 一覧: schema/mermaid/index.md
          - Three-Store 全体俯瞰: schema/mermaid/overview.md
          - "Core: 全体構造マップ": schema/mermaid/core-overview.md
          - "Core: ポータブル識別子": schema/mermaid/core-identity.md
          - "Core: 現行状態プロジェクション": schema/mermaid/core-current-state.md
          - "Core: カバレッジ・取得証跡": schema/mermaid/core-coverage.md
          - "Core: Git ドメイン・コミット DAG": schema/mermaid/core-git.md
          - "Core: CAS・完全性・保持義務": schema/mermaid/core-cas.md
          - "Core: Exchange ステージング": schema/mermaid/core-exchange.md
          - "Operational: 実行ジョブ・進捗": schema/mermaid/operational.md
          - "Search: 検索プロジェクション・FTS5": schema/mermaid/search.md
      - DBML エクスポート: schema/dbml/index.md
  - 設計決定 (ADR):
      - ADR 一覧: adr/index.md
      - "ADR 0001: 開発・リリース検証ライフサイクル": adr/0001-validation-lifecycle-architecture.md
      - "ADR 0002: Three-Store Boundary": adr/0002-three-store-boundary-architecture.md
  - 開発・テスト: development/index.md
