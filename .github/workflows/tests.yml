name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode (development or release)
        type: choice
        options:
          - development
          - release
        default: development
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sqlite-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check current SQLite validation policy
        run: python scripts/check_sqlite_validation_policy.py --scope product
      - name: Test policy detector against prohibited and permitted configurations
        run: python -m unittest discover -s tests/unit -p test_sqlite_validation_policy.py
      - name: Test product Python integrity and runtime binding with stdlib only
        run: python -m unittest discover -s tests/unit -p test_ci_python_runtime.py
      - name: Test local Python setup orchestration and verified launcher with stdlib only
        run: python -m unittest discover -s tests/unit -p test_local_python_setup.py
  offline:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON_DOWNLOADS: never
      CI_FEATURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_VALIDATION_MODE: ${{ github.event.inputs.mode || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/product-python
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
      - name: Plan checks from changed files
        id: plan
        run: python scripts/ci_profile.py run --name planning -- python scripts/ci_plan.py
      - name: Validate prose
        run: python scripts/ci_profile.py run --name report-validation -- python scripts/ci_execute.py reports
      - name: Prepare dependencies (online preparation)
        if: steps.plan.outputs.dependencies == 'true'
        run: python scripts/ci_profile.py run --name dependency-setup -- uv sync --locked --group dev --python "$CI_PRODUCT_PYTHON"
      - name: Confirm dependency environment identity
        if: steps.plan.outputs.dependencies == 'true'
        run: uv run --no-sync python scripts/ci_python_runtime.py probe artifacts/runtime/dependencies.json --reference artifacts/runtime/selected.json
      - name: Check minimal sdist membership, source hashes and byte budgets
        if: steps.plan.outputs.sdist_contract == 'true'
        run: >-
          python scripts/ci_profile.py run --name sdist_contract --
          uv run --no-sync python scripts/check_sdist_contract.py
          --build --all-distributions --output artifacts/ci-profile/sdist-members.json
      - name: Prepare locked wheels (online preparation)
        if: steps.plan.outputs.wheelhouse == 'true'
        run: python scripts/ci_profile.py run --name wheelhouse -- uv run --no-sync python scripts/prepare_wheelhouse.py
      - name: Ruff lint and formatting
        if: steps.plan.outputs.static == 'true'
        run: |
          python scripts/ci_profile.py run --name lint -- uv run --no-sync ruff check src packages tests scripts
          python scripts/ci_profile.py run --name format -- uv run --no-sync ruff format --check src packages tests scripts
      - name: Inspect SQLite capabilities and doctor
        if: steps.plan.outputs.smoke == 'true'
        run: |
          python scripts/ci_profile.py run --name fts -- uv run --no-sync python -c "import sqlite3; print(sqlite3.sqlite_version); c=sqlite3.connect(':memory:'); c.execute(\"CREATE VIRTUAL TABLE f USING fts5(body,tokenize='trigram case_sensitive 1',content='',detail=full)\")"
          python scripts/ci_profile.py run --name doctor -- uv run --no-sync repo-catalog --format json doctor
      - name: Verify composed schema and generated guards
        if: steps.plan.outputs.smoke == 'true'
        run: |
          uv run --no-sync python scripts/audit_publication_free.py > artifacts/ci-profile/schema-map.json
          cmp artifacts/ci-profile/schema-map.json docs/phase2/publication-free-schema-map.json
      - name: Collect selected tests before execution
        if: steps.plan.outputs.tests == 'true' || steps.plan.outputs.packaging == 'true'
        run: uv run --no-sync python scripts/ci_execute.py collect
      - name: Current catalog3 checks (offline)
        if: steps.plan.outputs.tests == 'true'
        run: uv run --no-sync python scripts/ci_execute.py run --lane tests
      - name: Installed wheel and sdist checks (offline, isolated parallel workers)
        if: steps.plan.outputs.packaging == 'true'
        run: uv run --no-sync python scripts/ci_execute.py run --lane packaging
      - name: Reconcile selected checks and report unexecuted coverage
        if: always()
        run: python scripts/ci_execute.py gate
      - name: Emit bounded verification receipts to job log
        if: always()
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import subprocess
          import textwrap
          import zipfile
          from pathlib import Path

          root = Path("artifacts/ci-profile")
          files = {p.name: p.read_bytes() for p in sorted(root.glob("*"))
                   if p.is_file() and (p.suffix in {".json", ".md", ".xml"}
                                      or p.name == "selected-tests.txt")}
          files["receipt-binding.json"] = (json.dumps({
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "feature_sha": os.environ.get("CI_FEATURE_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }, sort_keys=True) + "\n").encode()
          files["receipt-index.json"] = (json.dumps({
              name: {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              for name, data in files.items()
          }, sort_keys=True) + "\n").encode()
          output = io.BytesIO()
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for name, data in files.items():
                  info = zipfile.ZipInfo(name)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, data)
          body = output.getvalue()
          if len(body) > 2 * 1024 * 1024:
              raise SystemExit("CI receipts exceed the bounded log limit; use the artifact")
          digest = hashlib.sha256(body).hexdigest()
          print(f"CI_RECEIPTS_BEGIN_V1 {digest} {len(body)}")
          for line in textwrap.wrap(base64.b64encode(body).decode("ascii"), 120):
              print("CI_RECEIPTS_DATA_V1 " + line)
          print("CI_RECEIPTS_END_V1 " + digest)
          PY
      - name: Retain timing and selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runtime/
            artifacts/ci-profile/*.json
            artifacts/ci-profile/*.jsonl
            artifacts/ci-profile/*.md
            artifacts/ci-profile/*.xml
            artifacts/ci-profile/selected-tests.txt
          retention-days: 30
