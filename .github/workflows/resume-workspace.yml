# Temporary transport for the offline editor; removed before final revision.
name: resume-workspace
on:
  push:
    branches: [refactor/portable-document-observations]
    paths: [.github/workflows/resume-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle tracked public repository
        run: |
          mkdir -p /tmp/resume-workspace
          git bundle create /tmp/resume-workspace/source.bundle --all
          git rev-parse HEAD > /tmp/resume-workspace/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resume-workspace
          path: /tmp/resume-workspace/
          retention-days: 1
