name: One-off verified A4 Git-object preparation

on:
  pull_request:
    paths:
      - '.github/workflows/access-a4-prepare.yml'
      - '.github/access-a4-preparation/**'

permissions:
  contents: read

jobs:
  prepare-unreferenced-blobs:
    if: github.repository == 'TakashiSasaki/git-repo-db' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/access-a4-local-git-acquisition'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed patch and upload unreferenced blobs, never move refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYJOB'
          import base64, datetime, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = "TakashiSasaki/git-repo-db"
          baseline = "c82fe24454926e2213a476f7bdfd7650519b12b6"
          baseline_tree = "0b64d6a8e9eb2d88795eff6c3ce78f25840fcdd1"
          final_tree = "6ea8778ff721c64a86a6cb86f085e1ad8c94da81"
          gzip_sha256 = "e6b49bfe1cd8abf94181daf32dabbc823ac0e99c361e43265f86d6542004c5c4"
          patch_sha256 = "5f37f59b7ace88adac6febc47f719e4cdd4e73a54a3f16c6f72294eaadd37e59"
          paths_sha256 = "238d4411055f207daeb2bd4591a4f22d8249e3b757d8536746e7f86eb6737a51"
          start = datetime.datetime.now(datetime.timezone.utc).isoformat()
          def git(*args):
              return subprocess.check_output(["git", *args])
          assert os.environ["GITHUB_REPOSITORY"] == repo
          data = b"".join(pathlib.Path(f".github/access-a4-preparation/part{i}.bin").read_bytes() for i in range(19))
          assert len(data) == 27346 and hashlib.sha256(data).hexdigest() == gzip_sha256
          patch = gzip.decompress(data)
          assert len(patch) == 110080 and hashlib.sha256(patch).hexdigest() == patch_sha256
          patch_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verified-a4.patch"
          patch_path.write_bytes(patch)
          assert git("rev-parse", baseline + "^{tree}").decode().strip() == baseline_tree
          git("checkout", "--detach", baseline)
          git("apply", "--index", "--check", str(patch_path))
          git("apply", "--index", str(patch_path))
          assert git("write-tree").decode().strip() == final_tree
          changed = git("diff", "--cached", "--name-only", baseline)
          assert hashlib.sha256(changed).hexdigest() == paths_sha256
          paths = changed.decode().splitlines()
          assert len(paths) == 20
          results = []
          for path in paths:
              mode, sha, stage = git("ls-files", "--stage", "--", path).decode().split("\t", 1)[0].split()
              assert mode == "100644" and stage == "0"
              body = pathlib.Path(path).read_bytes()
              assert len(body) < 2_000_000
              assert hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest() == sha
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=json.dumps({"content": base64.b64encode(body).decode(), "encoding": "base64"}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result["sha"] == sha
              results.append({"path": path, "mode": mode, "type": "blob", "sha": sha, "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()})
              print("Verified unreferenced blob:", path, sha)
          output = pathlib.Path("artifacts/access-a4-preparation")
          output.mkdir(parents=True, exist_ok=True)
          (output / "objects.json").write_text(json.dumps({"baseline_commit": baseline, "baseline_tree": baseline_tree, "final_tree": final_tree, "patch_sha256": patch_sha256, "start": start, "end": datetime.datetime.now(datetime.timezone.utc).isoformat(), "refs_modified": False, "files": results}, indent=2) + "\n")
          PYJOB
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: access-a4-prepared-objects
          path: artifacts/access-a4-preparation/
          if-no-files-found: error
