      - 'docs/adr/0024-actual-notes-resource-work-accounting.md'
      - 'docs/adr/0025-cumulative-request-budgets-and-scoped-blockers.md'
      - 'docs/adr/0026-stop-salvage-restore-merge-after-corruption.md'
      - 'docs/adr/0028-classified-times-and-sha256-exchange.md'
      - 'docs/adr/0029-independent-access-store.md'
      - 'docs/adr/0030-context-repository-relations-and-selective-exchange.md'
      - 'docs/adr/0031-generalized-context-resources.md'
      - 'docs/adr/0032-environment-sqlite-validation.md'
      - 'docs/adr/0033-minimal-product-sdist.md'
      - 'docs/transport-independent-core-adr.md'
      - 'docs/phase2/no-independent-publication-adr.md'
      - 'docs/adr/0034-repository-test-and-ci-efficiency.md'
      - 'docs/adr/0035-independent-documentation-workspace.md'
      - 'docs/adr/0036-ref-observations-and-shared-notes-mappings.md'
      - 'docs/adr/README.md'
      - 'docs/adr/policy.md'
      - 'docs/architecture/access-store-design.md'
      - 'scripts/**'
      - 'src/**'
      # Transitive Python inputs executed by schema_viz.py --check.
      - 'src/repo_catalog/__init__.py'
      - 'src/repo_catalog/adapters/sqlite/cas_integrity.py'
      - 'src/repo_catalog/adapters/sqlite/git_intrinsic.py'
      - 'src/repo_catalog/adapters/sqlite/json_contracts.py'
      - 'src/repo_catalog/adapters/sqlite/transactions.py'
      - 'src/repo_catalog/domain/git_decoding.py'
      - 'src/repo_catalog/domain/git_intrinsic.py'
      - 'src/repo_catalog/domain/models.py'
      - 'src/repo_catalog/domain/payload.py'
      - 'src/repo_catalog/domain/time.py'
      - 'src/repo_catalog/resources/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build-and-validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/product-python

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'

      - name: Set up Node.js for Mermaid CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare selected product producer
        run: |
          uv sync --locked --group dev --python "$CI_PRODUCT_PYTHON"
          uv run --no-sync python scripts/schema_inventory.py --source "$(git rev-parse HEAD)" --output documentation/.build/inputs

      - name: Install isolated documentation dependencies
        run: uv sync --locked --project documentation --python "$CI_PRODUCT_PYTHON"

      - name: Verify schema visualization freshness
        run: uv run --no-sync --project documentation python documentation/tools/schema_viz.py --ir documentation/.build/inputs/inventory.json --check

      - name: Execute independent documentation obligations and retain receipt
        env:
          CI_FEATURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          source_sha=$(git rev-parse HEAD)
          uv run --no-sync --project documentation python documentation/tools/verify_documentation.py --product-source "$source_sha" --documentation-source "$source_sha"

      - name: Retain private documentation verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: documentation/.build/verification/
          retention-days: 7

      - name: Retain preview artifact for review
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview-${{ github.event.pull_request.number || github.sha }}
          path: documentation/site/
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/site/

  deploy:
    name: deploy-to-pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
