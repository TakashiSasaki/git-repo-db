name: pages
on:
  push:
    branches: [web]
  pull_request:
    branches: [web]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the complete site to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && 'pages-production' || format('pages-preview-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.deploy) }}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check import limit and independent frontend
        run: |
          node scripts/check_web_tree.mjs
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
      - name: Prepare exact external product inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_product.py
      - name: Verify and retain website evidence
        env:
          CI_FEATURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPLETE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          product_sha=$(python -c 'import json; print(json.load(open("product-source.json"))["commit"])')
          web_sha=$(git rev-parse HEAD)
          if [ "$COMPLETE_BUILD" = true ]; then
            website/.venv/bin/python website/tools/verify_documentation.py --product-source "$product_sha" --documentation-source "$web_sha"
          else
            website/.venv/bin/python website/tools/verify_documentation.py --product-source "$product_sha" --documentation-source "$web_sha" --preview
          fi
      - name: Retain private verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/.build/verification/
          retention-days: 7
      - name: Retain site preview
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview-${{ github.sha }}
          path: website/site/
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/web'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/web'
        with:
          path: website/site/
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/web'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
