# Temporary transport for verified public Git objects. Absent from final tree.
name: publish-implementation
on:
  push:
    branches: [refactor/portable-document-observations]
    paths: ['.github/implementation/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish tested Git objects
        env:
          EXPECTED_HEAD: 93492a3beb4b7600b588ebced2a0b162ec843371
          EXPECTED_TREE: f0fa02ba88833cf4d7579233853a290bb5fd321c
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import lzma
          raw = b''.join(Path(f'.github/implementation/part-{i}').read_bytes() for i in range(3))
          assert hashlib.sha256(raw).hexdigest() == '434d153bb495fcae16b9386537e82d6022d0bd790942045616fbe45edd67c339'
          bundle = lzma.decompress(raw)
          assert len(bundle) == 129896
          assert hashlib.sha256(bundle).hexdigest() == '0a0f92e81785ed80afbfd89fabd122a6029083ee1e6e71bc70bc8e0b1ae2d3d9'
          Path('/tmp/verified-implementation.bundle').write_bytes(bundle)
          PY
          git bundle verify /tmp/verified-implementation.bundle
          git fetch --no-tags /tmp/verified-implementation.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_HEAD^{tree}")" = "$EXPECTED_TREE"
          git merge-base --is-ancestor b6cca875b9a303989bc8947dc56dddb04d7b9ec2 "$EXPECTED_HEAD"
          NEW=$(printf '%s\n' 'Merge verified portable identity and document observation implementation' | git -c user.name=ChatGPT -c user.email=noreply@openai.com commit-tree "$EXPECTED_TREE" -p "$GITHUB_SHA" -p "$EXPECTED_HEAD")
          test "$(git ls-remote origin refs/heads/refactor/portable-document-observations | cut -f1)" = "$GITHUB_SHA"
          git push origin "$NEW:refs/heads/refactor/portable-document-observations"
          printf 'Published %s; verified final tree %s.\n' "$NEW" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
