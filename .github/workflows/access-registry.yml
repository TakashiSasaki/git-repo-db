name: Access registry focused verification

on:
  pull_request:
    paths:
      - '.github/workflows/access-registry.yml'
      - 'src/repo_catalog/**/access*.py'
      - 'src/repo_catalog/adapters/sqlite/access_ddl/**'
      - 'tests/integration/access/**'
      - 'tests/unit/test_access*_values.py'
      - 'scripts/verify_access_distribution.py'
      - 'scripts/audit_access_acceptance.py'
      - 'docs/implementation/access-a6-acceptance.json'
      - 'scripts/audit_callsite_dependencies.py'
      - 'src/repo_catalog/domain/context_registration.py'
      - 'src/repo_catalog/domain/acquisition.py'
      - 'src/repo_catalog/domain/native_acquisition.py'
      - 'src/repo_catalog/domain/ports/notes.py'
      - 'src/repo_catalog/adapters/git/native.py'
      - 'src/repo_catalog/adapters/git/notes.py'
      - 'src/repo_catalog/application/notes.py'
      - 'src/repo_catalog/adapters/sqlite/notes.py'
      - 'src/repo_catalog/adapters/sqlite/acquisition.py'
      - 'src/repo_catalog/adapters/sqlite/git_core.py'
      - 'src/repo_catalog/domain/exchange.py'
      - 'src/repo_catalog/adapters/sqlite/p1_context.py'
      - 'src/repo_catalog/adapters/sqlite/production_context.py'
      - 'src/repo_catalog/adapters/sqlite/p1_ddl/**'
      - 'src/repo_catalog/application/acquisition.py'
      - 'src/repo_catalog/application/exchange.py'
      - 'src/repo_catalog/application/production_query.py'
      - 'tests/unit/test_context_registration_values.py'
      - 'tests/unit/test_native_acquisition_values.py'
      - 'tests/integration/p2/**'
      - 'tests/integration/p4/**'
      - 'tests/integration/p1/**'
      - 'tests/integration/p3/**'
      - 'tests/integration/p5/**'
      - 'tests/integration/p6/**'
      - 'tests/integration/p7/**'
      - 'scripts/audit_context_registration.py'
      - 'docs/implementation/access-a3-routing.json'
      - 'docs/implementation/p1-disposition.json'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  registry-sqlite-3513:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Build and verify the actual minimum SQLite binding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/access-sqlite" artifacts/access-registry
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 \
            https://www.sqlite.org/2026/sqlite-amalgamation-3510300.zip \
            -o "$RUNNER_TEMP/access-sqlite/sqlite.zip"
          unzip -q "$RUNNER_TEMP/access-sqlite/sqlite.zip" -d "$RUNNER_TEMP/access-sqlite"
          export SQLITE_C="$RUNNER_TEMP/access-sqlite/sqlite-amalgamation-3510300/sqlite3.c"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          # Official release record: https://sqlite.org/releaselog/3_51_3.html
          expected = "32d5424f97e0a7fc5ed2f6335afbb58be4e0298bd7117a34e39d345ff13d859e"
          actual = hashlib.sha3_256(Path(os.environ["SQLITE_C"]).read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          print("Verified official sqlite3.c SHA3-256:", actual)
          PY
          cc -O2 -fPIC -shared -DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_FTS5 \
            "$SQLITE_C" -o "$RUNNER_TEMP/access-sqlite/libsqlite3.so.0" -ldl -lpthread -lm
          cp "$RUNNER_TEMP/access-sqlite/libsqlite3.so.0" artifacts/access-registry/
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/access-sqlite${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Verify runtime and focused tests without overrides
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY' | tee artifacts/access-registry/runtime.txt
          import platform, sqlite3
          from repo_catalog.adapters.sqlite.access_schema import require_runtime
          require_runtime()
          assert sqlite3.sqlite_version_info == (3, 51, 3), sqlite3.sqlite_version
          db = sqlite3.connect(":memory:")
          source = db.execute("SELECT sqlite_source_id()").fetchone()[0]
          assert source == "2026-03-13 10:38:09 737ae4a34738ffa0c3ff7f9bb18df914dd1cad163f28fd6b6e114a344fe6d618", source
          print("Python:", platform.python_version(), "SQLite:", sqlite3.sqlite_version, "source:", source)
          db.close()
          PY
          uv run --no-sync pytest -q tests/unit/test_access*_values.py tests/unit/test_context_registration_values.py tests/unit/test_native_acquisition_values.py tests/integration/access \
            tests/integration/p1/test_schema.py tests/integration/p1/test_context.py \
            tests/integration/p1/test_validation_stop.py tests/integration/p1/test_coordination.py \
            tests/integration/p1/test_disposition.py tests/integration/p1/test_context_relations.py \
            tests/integration/p3 tests/integration/p5 tests/integration/i3 \
            tests/integration/p2 tests/integration/p4 tests/integration/p6 tests/integration/p7 \
            --collect-only > artifacts/access-registry/collected.txt
          uv run --no-sync pytest -q tests/unit/test_access*_values.py tests/unit/test_context_registration_values.py tests/unit/test_native_acquisition_values.py tests/integration/access \
            tests/integration/p1/test_schema.py tests/integration/p1/test_context.py \
            tests/integration/p1/test_validation_stop.py tests/integration/p1/test_coordination.py \
            tests/integration/p1/test_disposition.py tests/integration/p1/test_context_relations.py \
            tests/integration/p3 tests/integration/p5 tests/integration/i3 \
            tests/integration/p2 tests/integration/p4 tests/integration/p6 tests/integration/p7 \
            --junitxml=artifacts/access-registry/tests.xml
      - name: Verify wheel and sdist-derived wheel outside checkout
        run: uv run --no-sync python scripts/verify_access_distribution.py
      - name: Check isolated module ownership and baseline evidence
        run: |
          uv run --no-sync python scripts/audit_callsite_dependencies.py --check
          uv run --no-sync python scripts/build_p1_schema.py --check
          uv run --no-sync python scripts/audit_p1_schema.py --check
          uv run --no-sync python scripts/audit_implementation_boundary.py --check
          uv run --no-sync python scripts/audit_context_registration.py
      - name: Reconcile Access acceptance ledger and exact test nodes
        run: |
          uv run --no-sync python scripts/audit_access_acceptance.py \
            --junit artifacts/access-registry/tests.xml \
            --collection artifacts/access-registry/collected.txt \
            --output artifacts/access-registry/acceptance.json
      - name: Build allowlisted MkDocs sources with placeholder diagrams, no deployment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group dev --group docs
          uv run --no-sync python scripts/build_docs_site.py --no-mermaid \
            2>&1 | tee artifacts/access-registry/mkdocs.txt
      - name: Check formatting of the exact committed files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          targets=(scripts/audit_access_acceptance.py src/repo_catalog/adapters/sqlite/git_core.py src/repo_catalog/domain/access_backup.py src/repo_catalog/domain/ports/access_backup.py src/repo_catalog/adapters/sqlite/access_backup.py src/repo_catalog/application/access_maintenance.py src/repo_catalog/cli/access_maintenance.py src/repo_catalog/domain/native_acquisition.py src/repo_catalog/adapters/git/access_native.py src/repo_catalog/application/access_acquisition.py src/repo_catalog/cli/access_acquisition.py src/repo_catalog/adapters/git/native.py src/repo_catalog/adapters/git/notes.py src/repo_catalog/application/notes.py src/repo_catalog/adapters/sqlite/notes.py src/repo_catalog/adapters/sqlite/acquisition.py src/repo_catalog/domain/ports/notes.py tests/unit/test_native_acquisition_values.py src/repo_catalog/domain/context_registration.py src/repo_catalog/domain/acquisition.py src/repo_catalog/domain/exchange.py src/repo_catalog/adapters/sqlite/p1_context.py src/repo_catalog/adapters/sqlite/production_context.py src/repo_catalog/application/acquisition.py src/repo_catalog/application/exchange.py src/repo_catalog/application/production_query.py tests/unit/test_context_registration_values.py tests/integration/p1/test_context_relations.py tests/integration/p3/test_production_context.py tests/integration/p5/test_provider_acquisition.py tests/integration/p6/conftest.py scripts/audit_context_registration.py src/repo_catalog/domain/access_workflow.py src/repo_catalog/domain/ports/access_workflow.py src/repo_catalog/application/access_workflow.py src/repo_catalog/adapters/filesystem/access_executor.py src/repo_catalog/cli/access_workflow.py src/repo_catalog/domain/access_connections.py src/repo_catalog/domain/ports/access_connections.py src/repo_catalog/adapters/sqlite/access_connections.py src/repo_catalog/domain/access_registry.py src/repo_catalog/domain/ports/access_registry.py src/repo_catalog/adapters/sqlite/access_registry.py src/repo_catalog/adapters/sqlite/access_schema.py tests/unit/test_access*_values.py tests/integration/access scripts/verify_access_distribution.py)
          lint=0
          formatting=0
          uv run --no-sync ruff check "${targets[@]}" || lint=$?
          uv run --no-sync ruff format --check "${targets[@]}" || formatting=$?
          if (( lint != 0 || formatting != 0 )); then
            uv run --no-sync ruff check --diff "${targets[@]}" > artifacts/access-registry/lint.diff || true
            uv run --no-sync ruff format --diff "${targets[@]}" > artifacts/access-registry/format.diff || true
            cat artifacts/access-registry/lint.diff artifacts/access-registry/format.diff
            exit 1
          fi
      - name: Save exact source and locked formatter for offline reproduction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/access-registry
          git archive --format=tar.gz HEAD -o artifacts/access-registry/source.tar.gz
          if [[ -x .venv/bin/ruff ]]; then
            cp .venv/bin/ruff artifacts/access-registry/ruff
          fi
          python - <<'PYMETA'
          import json, os, subprocess
          from pathlib import Path
          def revision(name):
              return subprocess.check_output(["git", "rev-parse", name], text=True).strip()
          result = {"checked_out_commit": revision("HEAD"), "effective_tree": revision("HEAD^{tree}"), "event_commit": os.environ["GITHUB_SHA"]}
          Path("artifacts/access-registry/source-revision.json").write_text(json.dumps(result, indent=2) + "\n")
          PYMETA
      - name: Save focused verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: access-registry-verification
          path: artifacts/access-registry/
          if-no-files-found: warn
