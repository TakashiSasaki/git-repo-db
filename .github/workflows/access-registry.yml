name: Access registry focused verification

on:
  pull_request:
    paths:
      - 'tests/integration/i2/**'
      - 'tests/integration/i3/**'
      - 'tests/integration/i23/**'
      - 'tests/integration/i4/**'
      - 'tests/integration/i5/**'
      - 'tests/packaging/test_p5_distribution.py'
      - 'scripts/verify_i5_offline.py'
      - 'scripts/check_sdist_contract.py'
      - 'scripts/verify_i4_distribution.py'
      - 'scripts/verify_i5_distribution.py'
      - 'scripts/installed_test_harness.py'
      - 'tests/support/distributions.py'
      - 'tests/support/context_admission.py'
      - 'tests/support/authorized_context.py'
      - 'tests/support/i6a.py'
      - 'tests/packaging/**'
      - 'tests/unit/test_installed_test_harness.py'
      - '.github/workflows/access-registry.yml'
      - '.github/actions/product-python/**'
      - 'scripts/ci_python_runtime.*'
      - 'src/repo_catalog/**/access*.py'
      - 'src/repo_catalog/adapters/sqlite/access_ddl/**'
      - 'tests/integration/access/**'
      - 'tests/unit/test_access*_values.py'
      - 'scripts/verify_access_distribution.py'
      - 'scripts/audit_access_acceptance.py'
      - 'docs/implementation/access-a6-acceptance.json'
      - 'scripts/audit_callsite_dependencies.py'
      - 'src/repo_catalog/domain/context_registration.py'
      - 'src/repo_catalog/domain/acquisition.py'
      - 'src/repo_catalog/domain/native_acquisition.py'
      - 'src/repo_catalog/domain/ports/notes.py'
      - 'src/repo_catalog/adapters/git/native.py'
      - 'src/repo_catalog/adapters/git/notes.py'
      - 'src/repo_catalog/application/notes.py'
      - 'src/repo_catalog/adapters/sqlite/notes.py'
      - 'src/repo_catalog/adapters/sqlite/acquisition.py'
      - 'src/repo_catalog/adapters/sqlite/git_core.py'
      - 'src/repo_catalog/domain/exchange.py'
      - 'src/repo_catalog/adapters/sqlite/p1_context.py'
      - 'src/repo_catalog/adapters/sqlite/production_context.py'
      - 'src/repo_catalog/adapters/sqlite/p1_ddl/**'
      - 'src/repo_catalog/application/acquisition.py'
      - 'src/repo_catalog/application/exchange.py'
      - 'src/repo_catalog/application/production_query.py'
      - 'tests/unit/test_context_registration_values.py'
      - 'tests/unit/test_native_acquisition_values.py'
      - 'tests/integration/p2/**'
      - 'tests/integration/p4/**'
      - 'tests/integration/p1/**'
      - 'tests/integration/p3/**'
      - 'tests/integration/p5/**'
      - 'tests/integration/p6/**'
      - 'tests/integration/p7/**'
      - 'scripts/audit_context_registration.py'
      - 'docs/implementation/access-a3-routing.json'
      - 'docs/implementation/p1-disposition.json'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  registry-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/product-python
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'
      - name: Install locked development dependencies
        run: |
          uv sync --locked --group dev --group docs --python "$CI_PRODUCT_PYTHON"
          uv run --no-sync python scripts/ci_python_runtime.py probe artifacts/runtime/dependencies.json --reference artifacts/runtime/selected.json
      - name: Prepare locked wheels before offline installed acceptance
        run: uv run --no-sync python scripts/prepare_wheelhouse.py
      - name: Verify runtime environment preflight
        run: uv run --no-sync python scripts/preflight_access.py --output artifacts/access-registry/preflight.json
      - name: Verify scoped Access acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -p artifacts/access-registry
          uv run --no-sync pytest -q \
            tests/unit/test_access*_values.py \
            tests/unit/test_context_registration_values.py \
            tests/unit/test_native_acquisition_values.py \
            tests/integration/access \
            --collect-only > artifacts/access-registry/collected.txt
          workers=$(uv run --no-sync python -c "from scripts import resource_scheduler; print(resource_scheduler.calculate_worker_budget(lane_name='focused'))")
          uv run --no-sync pytest -q -n "$workers" --dist worksteal \
            tests/unit/test_access*_values.py \
            tests/unit/test_context_registration_values.py \
            tests/unit/test_native_acquisition_values.py \
            tests/integration/access \
            --junitxml=artifacts/access-registry/tests.xml \
            > artifacts/access-registry/tests.log 2>&1
          tail -n 10 artifacts/access-registry/tests.log
      - name: Execute broad regression suite and record receipts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -p artifacts/access-registry/regressions
          uv run --no-sync python -m pytest -q \
            tests/integration/i2 tests/integration/i23 tests/integration/i4 tests/integration/i5 \
            tests/packaging/test_p5_distribution.py tests/integration/p1 tests/integration/p3 \
            tests/integration/p5 tests/integration/i3 tests/integration/p2 tests/integration/p4 \
            tests/integration/p6 tests/integration/p7 tests/integration/p5_p6_compatibility \
            --collect-only > artifacts/access-registry/regressions/collected.txt
          pytest_exit=0
          workers=$(uv run --no-sync python -c "from scripts import resource_scheduler; print(resource_scheduler.calculate_worker_budget(workload_count=1851, lane_name='tests'))")
          uv run --no-sync pytest -q -n "$workers" --dist worksteal \
            tests/integration/i2 tests/integration/i23 tests/integration/i4 tests/integration/i5 \
            tests/packaging/test_p5_distribution.py tests/integration/p1 tests/integration/p3 \
            tests/integration/p5 tests/integration/i3 tests/integration/p2 tests/integration/p4 \
            tests/integration/p6 tests/integration/p7 tests/integration/p5_p6_compatibility \
            --junitxml=artifacts/access-registry/regressions/regressions.xml \
            > artifacts/access-registry/regressions/regressions.log 2>&1 || pytest_exit=$?
          echo "Broad regression pytest exit code: $pytest_exit"
          echo "$pytest_exit" > artifacts/access-registry/regressions/pytest_exit_code.txt
          tail -n 10 artifacts/access-registry/regressions/regressions.log || true
          if [ "$pytest_exit" -ne 0 ] && [ "$pytest_exit" -ne 1 ]; then
            echo "pytest broad regression run terminated with unrecoverable exit code $pytest_exit"
            exit "$pytest_exit"
          fi
      - name: Reconcile regression manifest against baseline evidence
        if: ${{ !cancelled() }}
        run: |
          pytest_exit=$(cat artifacts/access-registry/regressions/pytest_exit_code.txt)
          uv run --no-sync python scripts/compare_access_regressions.py \
            --current artifacts/access-registry/regressions/regressions.xml \
            --baseline docs/implementation/evidence/adr0031-i6b-m01-m02-20261023/source-full-final/ordinary.xml.gz \
            --expected artifacts/access-registry/regressions/collected.txt \
            --pytest-exit-code "$pytest_exit" \
            --output artifacts/access-registry/failure-comparison.json \
            --strict
      - name: Installed I2 I3 I4 I5 on both distribution artifacts offline
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/verify_i5_distribution.py --output artifacts/access-registry/i5-distribution
      - name: Inventory offline and unexecuted coverage
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/verify_i5_offline.py --output artifacts/access-registry/offline-inventory
      - name: Verify wheel and sdist-derived wheel outside checkout
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/verify_access_distribution.py
      - name: Check isolated module ownership and baseline evidence
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python scripts/audit_callsite_dependencies.py --check
          uv run --no-sync python scripts/build_p1_schema.py --check
          uv run --no-sync python scripts/audit_p1_schema.py --check
          uv run --no-sync python scripts/audit_implementation_boundary.py --check
          uv run --no-sync python scripts/audit_context_registration.py
      - name: Reconcile Access acceptance ledger and exact test nodes
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync python scripts/audit_access_acceptance.py \
            --junit artifacts/access-registry/tests.xml \
            --collection artifacts/access-registry/collected.txt \
            --output artifacts/access-registry/acceptance.json
      - name: Build allowlisted MkDocs sources with placeholder diagrams, no deployment
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group dev --group docs --python "$CI_PRODUCT_PYTHON"
          uv run --no-sync python scripts/ci_python_runtime.py probe artifacts/runtime/docs.json --reference artifacts/runtime/selected.json
          uv run --no-sync python scripts/build_docs_site.py --no-mermaid \
            2>&1 | tee artifacts/access-registry/mkdocs.txt
      - name: Check formatting of the exact committed files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          targets=(scripts/preflight_access.py scripts/compare_access_regressions.py scripts/audit_access_acceptance.py src/repo_catalog/adapters/sqlite/git_core.py src/repo_catalog/domain/access_backup.py src/repo_catalog/domain/ports/access_backup.py src/repo_catalog/adapters/sqlite/access_backup.py src/repo_catalog/application/access_maintenance.py src/repo_catalog/cli/access_maintenance.py src/repo_catalog/domain/native_acquisition.py src/repo_catalog/adapters/git/access_native.py src/repo_catalog/application/access_acquisition.py src/repo_catalog/cli/access_acquisition.py src/repo_catalog/adapters/git/native.py src/repo_catalog/adapters/git/notes.py src/repo_catalog/application/notes.py src/repo_catalog/adapters/sqlite/notes.py src/repo_catalog/adapters/sqlite/acquisition.py src/repo_catalog/domain/ports/notes.py tests/unit/test_native_acquisition_values.py src/repo_catalog/domain/context_registration.py src/repo_catalog/domain/acquisition.py src/repo_catalog/domain/exchange.py src/repo_catalog/adapters/sqlite/p1_context.py src/repo_catalog/adapters/sqlite/production_context.py src/repo_catalog/application/acquisition.py src/repo_catalog/application/exchange.py src/repo_catalog/application/production_query.py tests/unit/test_context_registration_values.py tests/integration/p1/test_context_relations.py tests/integration/p3/test_production_context.py tests/integration/p5/test_provider_acquisition.py tests/integration/p6/conftest.py scripts/audit_context_registration.py src/repo_catalog/domain/access_workflow.py src/repo_catalog/domain/ports/access_workflow.py src/repo_catalog/application/access_workflow.py src/repo_catalog/adapters/filesystem/access_executor.py src/repo_catalog/cli/access_workflow.py src/repo_catalog/domain/access_connections.py src/repo_catalog/domain/ports/access_connections.py src/repo_catalog/adapters/sqlite/access_connections.py src/repo_catalog/domain/access_registry.py src/repo_catalog/domain/ports/access_registry.py src/repo_catalog/adapters/sqlite/access_registry.py src/repo_catalog/adapters/sqlite/access_schema.py tests/unit/test_access*_values.py tests/integration/access scripts/verify_access_distribution.py)
          lint=0
          formatting=0
          uv run --no-sync ruff check "${targets[@]}" || lint=$?
          uv run --no-sync ruff format --check "${targets[@]}" || formatting=$?
          if (( lint != 0 || formatting != 0 )); then
            uv run --no-sync ruff check --diff "${targets[@]}" > artifacts/access-registry/lint.diff || true
            uv run --no-sync ruff format --diff "${targets[@]}" > artifacts/access-registry/format.diff || true
            cat artifacts/access-registry/lint.diff artifacts/access-registry/format.diff
            exit 1
          fi
      - name: Save exact source and locked formatter for offline reproduction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/access-registry
          git archive --format=tar.gz HEAD -o artifacts/access-registry/source.tar.gz
          if [[ -x .venv/bin/ruff ]]; then
            cp .venv/bin/ruff artifacts/access-registry/ruff
          fi
          python - <<'PYMETA'
          import json, os, subprocess
          from pathlib import Path
          def revision(name):
              return subprocess.check_output(["git", "rev-parse", name], text=True).strip()
          result = {"checked_out_commit": revision("HEAD"), "effective_tree": revision("HEAD^{tree}"), "event_commit": os.environ["GITHUB_SHA"]}
          Path("artifacts/access-registry/source-revision.json").write_text(json.dumps(result, indent=2) + "\n")
          PYMETA
      - name: Audit final dependency runtime identity
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/ci_python_runtime.py probe artifacts/runtime/final.json --reference artifacts/runtime/selected.json
      - name: Emit indexed verification receipts to job log
        if: always()
        run: python scripts/emit_ci_evidence.py
      - name: Save focused verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: access-registry-verification
          path: |
            artifacts/access-registry/
            artifacts/runtime/
          if-no-files-found: warn
