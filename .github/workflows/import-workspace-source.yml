# Temporary tracked-source transport; remove from the final change.
name: import-workspace-source
on:
  push:
    branches: [refactor/import-workspace-db]
    paths: [.github/workflows/import-workspace-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package public tracked Git objects
        run: |
          mkdir -p /tmp/offline-source
          git bundle create /tmp/offline-source/source.bundle --all
          sha256sum /tmp/offline-source/source.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: import-workspace-source
          path: /tmp/offline-source/source.bundle
          retention-days: 1
