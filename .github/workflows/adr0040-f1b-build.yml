name: ADR0040 disposable F1-B builder and verification
on:
  push:
    branches: [verification/adr0040-f1b-20261111-7c91e2]
permissions:
  contents: write
jobs:
  f1b:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: f6a6a3ca2dd64e92a6fc4decd460a62e44e01a25
      BASE_TREE: 007749b955d156ee6a7a24a7798ed6f9dffc4e5f
      MAIN: 3a5457af1e42c158641a73fe5172cad2dbe0718c
      FEATURE: feat/adr0040-f1-hash-states-20261111
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v7
        with:
          ref: f6a6a3ca2dd64e92a6fc4decd460a62e44e01a25
          path: source
          fetch-depth: 1
          show-progress: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          cache-dependency-glob: |
            source/uv.lock
            source/tools/schema-model/uv.lock
      - name: Implement and verify bounded child source
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/adr0040-f1b-evidence"
          mkdir "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          run() {
            name="$1"; shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"
            printf '\n' >> "$EVIDENCE/$name.command"
            set +e
            "$@" > "$EVIDENCE/$name.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$EVIDENCE/$name.exit"
            printf '%s: exit %s\n' "$name" "$rc"
            if [ "$rc" != 0 ]; then tail -n 40 "$EVIDENCE/$name.log"; fi
            return "$rc"
          }
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/feat/adr0040-f1-outcomes-20261111 | cut -f1)" = "$BASE"
          test -z "$(git ls-remote origin refs/heads/$FEATURE)"
          run bootstrap ./scripts/setup-local-python.sh
          run apply python3 "$GITHUB_WORKSPACE/harness/.github/verification/implement_f1b.py"
          PYFILES=(tools/schema-model/instance_fixture.py tools/schema-model/instance_model.py tools/schema-model/outcome_profile.py tools/schema-model/hash_profile.py tools/schema-model/test_hash_model.py)
          run autofix scripts/local-run.sh ruff check --fix "${PYFILES[@]}"
          run format scripts/local-run.sh ruff format "${PYFILES[@]}"
          git switch -c "$FEATURE"
          git add tools/schema-model/instance_fixture.py tools/schema-model/instance_model.py tools/schema-model/outcome_profile.py tools/schema-model/hash_profile.py tools/schema-model/test_hash_model.py tools/schema-model/instance_shapes.ttl tools/schema-model/instance_constraints.json tools/schema-model/INSTANCE-PILOT.md
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'instance_fixture.py','instance_model.py','outcome_profile.py','hash_profile.py','test_hash_model.py','instance_shapes.ttl','instance_constraints.json','INSTANCE-PILOT.md'}
          assert set(paths)=={'tools/schema-model/'+p for p in allowed},paths
          print('Scoped child changes:',len(paths))
          PY
          run commit git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(schema-model): validate Filesystem hash states and digest tuples'
          export CANDIDATE="$(git rev-parse HEAD)"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = "$BASE"
          run push git push origin "HEAD:refs/heads/$FEATURE"
          git show -s --format=fuller HEAD > "$EVIDENCE/candidate.txt"
          git rev-parse HEAD^{tree} >> "$EVIDENCE/candidate.txt"
          run tool-sync uv sync --project tools/schema-model --locked --python "$(scripts/local-run.sh python -c 'import sys; print(sys._base_executable)')"
          scripts/local-run.sh python - <<'PY' > "$EVIDENCE/runtime-isolation.json"
          import json,os,platform,sqlite3,sys,tempfile
          from pathlib import Path
          from repo_catalog.worktrees import discover_topology
          root=Path(tempfile.mkdtemp(prefix='f1b-fixtures-',dir=os.environ['RUNNER_TEMP']))
          markers=[str(p/'.git') for p in (root,*root.parents) if (p/'.git').exists()]
          observed=discover_topology(root)
          assert not markers,markers
          assert observed.status=='not_git',repr(observed)
          print(json.dumps({'python':sys.version,'sqlite':sqlite3.sqlite_version,
              'architecture':platform.machine(),'temp_root':str(root),
              'ancestor_git_markers':markers,'product_git_discovery':observed.status}))
          PY
          export TMPDIR="$(python3 -c 'import json,os; print(json.load(open(os.environ["EVIDENCE"]+"/runtime-isolation.json"))["temp_root"])')"
          run values-fixture bash -c 'scripts/local-run.sh python tools/schema-model/instance_fixture.py > "$EVIDENCE/values.json"'
          run outcomes-fixture bash -c 'scripts/local-run.sh python tools/schema-model/instance_fixture.py --profile filesystem-outcomes-v1 > "$EVIDENCE/outcomes.json"'
          run hashes-fixture bash -c 'scripts/local-run.sh python tools/schema-model/instance_fixture.py --profile filesystem-hash-v1 > "$EVIDENCE/hashes.json"'
          for label in values outcomes hashes; do
            run "$label-cli" uv run --project tools/schema-model --locked --offline python tools/schema-model/instance_model.py "$EVIDENCE/$label.json" "$EVIDENCE/$label-result"
          done
          export INSTANCE_FIXTURE="$EVIDENCE/values.json" OUTCOME_FIXTURE="$EVIDENCE/outcomes.json" HASH_FIXTURE="$EVIDENCE/hashes.json"
          run instance-tests uv run --project tools/schema-model --locked --offline python -m unittest discover -s tools/schema-model -p test_instance_model.py -q
          run outcome-tests uv run --project tools/schema-model --locked --offline python -m unittest discover -s tools/schema-model -p test_outcome_model.py -q
          run hash-tests uv run --project tools/schema-model --locked --offline python -m unittest discover -s tools/schema-model -p test_hash_model.py -q
          run product-tests scripts/local-run.sh python -m pytest -q -n 2 --basetemp="$TMPDIR/pytest-two" --junitxml="$EVIDENCE/product.xml" tests/filesystem/test_filesystem.py::test_changed_during_hash_is_not_admitted tests/filesystem/test_filesystem.py::test_lossless_path_symlink_fifo_and_non_utf8_export
          run lint scripts/local-run.sh ruff check "${PYFILES[@]}"
          run format-check scripts/local-run.sh ruff format --check "${PYFILES[@]}"
          run whitespace git diff --check "$BASE" HEAD
          test -z "$(git status --porcelain)"
      - name: Retain source-bound summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ.get('EVIDENCE',os.environ['RUNNER_TEMP']+'/adr0040-f1b-evidence'))
          root.mkdir(exist_ok=True)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          summary={'candidate':os.environ.get('CANDIDATE'),'observed_head':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'),'base':os.environ['BASE'],
              'workflow_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
              'exits':{p.stem:int(p.read_text()) for p in root.glob('*.exit')},
              'independent_agent_review':False,'final_git_status':git('status','--porcelain')}
          for label in ('values','outcomes','hashes'):
              path=root/(label+'-result')/'result.json'
              if path.exists():
                  r=json.loads(path.read_text())
                  summary[label]={'families':r.get('families'),'coverage':r.get('coverage'),'source':r.get('source'),
                      'tool':r.get('tool'),'checker_invocations_completed':r.get('checker_invocations_completed'),
                      'result_sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          for name in ('instance-tests','outcome-tests','hash-tests'):
              path=root/(name+'.log')
              if path.exists(): summary[name]=path.read_text(errors='replace')[-1500:]
          path=root/'runtime-isolation.json'
          if path.exists(): summary['runtime']=json.loads(path.read_text())
          path=root/'hashes.json'
          if path.exists() and path.stat().st_size:
              data=json.loads(path.read_text())
              summary['hash_api']=data.get('api')
              summary['hash_counts']=data.get('expected_counts')
          path=root/'product.xml'
          if path.exists():
              cases=ET.parse(path).getroot().findall('.//testcase')
              summary['product_tests']={'total':len(cases),'failures':sum(c.find('failure') is not None for c in cases),
                  'errors':sum(c.find('error') is not None for c in cases),'skipped':sum(c.find('skipped') is not None for c in cases)}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          index={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                 for p in sorted(root.rglob('*')) if p.is_file() and p.name!='index.json'}
          (root/'index.json').write_text(json.dumps(index,indent=2)+'\n')
          brief={k:v for k,v in summary.items() if k not in ('values','outcomes','hashes','hash_api')}
          brief['families']={k:summary.get(k,{}).get('families') for k in ('values','outcomes','hashes')}
          brief['hash_coverage']=summary.get('hashes',{}).get('coverage')
          print('F1B_SUMMARY '+json.dumps(brief))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adr0040-f1b-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/adr0040-f1b-evidence/
            source/artifacts/local-python/
          retention-days: 14
