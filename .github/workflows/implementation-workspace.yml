# Temporary implementation transport; remove before the final PR revision.
# Only tracked public source and locked public dependency wheels are archived.
name: implementation-workspace
on:
  push:
    branches: [refactor/portable-document-observations]
    paths: [.github/workflows/implementation-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - name: Package disposable offline workspace
        run: |
          mkdir -p /tmp/implementation-workspace/wheels
          git bundle create /tmp/implementation-workspace/source.bundle --all
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file /tmp/implementation-workspace/requirements.txt
          python -m pip download --require-hashes -r /tmp/implementation-workspace/requirements.txt --dest /tmp/implementation-workspace/wheels
          git rev-parse HEAD > /tmp/implementation-workspace/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-workspace
          path: /tmp/implementation-workspace/
          retention-days: 1
