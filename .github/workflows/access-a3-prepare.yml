name: One-off verified A3 Git-object preparation

on:
  pull_request:
    paths:
      - '.github/workflows/access-a3-prepare.yml'
      - '.github/access-a3-preparation/**'

permissions:
  contents: read

jobs:
  prepare-unreferenced-blobs:
    if: github.repository == 'TakashiSasaki/git-repo-db' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/access-a3-context-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reviewed patch and upload blobs only, never move refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYJOB'
          import base64, datetime, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = "TakashiSasaki/git-repo-db"
          baseline = "16c36f989f39aa9f9d2cf175dffb86e52da5a72d"
          baseline_tree = "2121af0d127a40e7d63c43126851da025ac6404b"
          final_tree = "0b64d6a8e9eb2d88795eff6c3ce78f25840fcdd1"
          gzip_sha256 = "ab02b841001c519075ba9c71c4463edd7eb5ba9b9866d69e83a59610c9e6d29d"
          patch_sha256 = "ff1d6ea57df95f0c182aab7fab4fc465810c65073855a43425a5e347633d526a"
          expected_paths = ['.agents/skills/three-store-invariants/references/context-registration-exchange.md', '.github/workflows/access-registry.yml', 'docs/implementation/access-a3-registration-boundary.md', 'docs/implementation/access-a3-routing.json', 'docs/implementation/p1-disposition.json', 'docs/implementation/p1-schema-contracts.md', 'docs/implementation/p5-p6-technical-contract.md', 'scripts/audit_callsite_dependencies.py', 'scripts/audit_context_registration.py', 'scripts/verify_access_distribution.py', 'src/repo_catalog/adapters/sqlite/p1_context.py', 'src/repo_catalog/adapters/sqlite/p1_ddl/context.sql', 'src/repo_catalog/adapters/sqlite/p1_ddl/fingerprints.json', 'src/repo_catalog/adapters/sqlite/production_context.py', 'src/repo_catalog/application/acquisition.py', 'src/repo_catalog/application/exchange.py', 'src/repo_catalog/application/production_query.py', 'src/repo_catalog/domain/acquisition.py', 'src/repo_catalog/domain/context_registration.py', 'src/repo_catalog/domain/exchange.py', 'tests/integration/access/test_context_boundary.py', 'tests/integration/p3/test_production_context.py', 'tests/integration/p5/test_provider_acquisition.py', 'tests/integration/p6/conftest.py', 'tests/unit/test_context_registration_values.py']
          start = datetime.datetime.now(datetime.timezone.utc).isoformat()
          def git(*args):
              return subprocess.check_output(["git", *args])
          assert os.environ["GITHUB_REPOSITORY"] == repo
          data = b"".join(pathlib.Path(f".github/access-a3-preparation/part{i}.bin").read_bytes() for i in range(4))
          assert len(data) == 24557 and hashlib.sha256(data).hexdigest() == gzip_sha256
          patch = gzip.decompress(data)
          assert len(patch) == 101895 and hashlib.sha256(patch).hexdigest() == patch_sha256
          patch_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verified-a3.patch"
          patch_path.write_bytes(patch)
          assert git("rev-parse", baseline + "^{tree}").decode().strip() == baseline_tree
          git("checkout", "--detach", baseline)
          git("apply", "--index", "--check", str(patch_path))
          git("apply", "--index", str(patch_path))
          assert git("write-tree").decode().strip() == final_tree
          changed = git("diff", "--cached", "--name-only", baseline).decode().splitlines()
          assert changed == expected_paths
          results = []
          for path in expected_paths:
              mode, sha, stage = git("ls-files", "--stage", "--", path).decode().split("\t", 1)[0].split()
              assert mode == "100644" and stage == "0"
              body = pathlib.Path(path).read_bytes()
              assert len(body) < 2_000_000
              assert hashlib.sha1(b"blob " + str(len(body)).encode() + b"\0" + body).hexdigest() == sha
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=json.dumps({"content": base64.b64encode(body).decode(), "encoding": "base64"}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result["sha"] == sha
              results.append({"path": path, "mode": mode, "type": "blob", "sha": sha, "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()})
              print("Verified unreferenced blob:", path, sha)
          output = pathlib.Path("artifacts/access-a3-preparation")
          output.mkdir(parents=True, exist_ok=True)
          (output / "objects.json").write_text(json.dumps({"baseline_commit": baseline, "baseline_tree": baseline_tree, "final_tree": final_tree, "patch_sha256": patch_sha256, "start": start, "end": datetime.datetime.now(datetime.timezone.utc).isoformat(), "refs_modified": False, "files": results}, indent=2) + "\n")
          PYJOB
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: access-a3-prepared-objects
          path: artifacts/access-a3-preparation/
          if-no-files-found: error
