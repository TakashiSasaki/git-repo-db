name: timestamp-source

on:
  push:
    branches:
      - refactor/unix-microsecond-timestamps

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source bundle
        run: git bundle create timestamp-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: timestamp-source
          path: timestamp-source.bundle
          retention-days: 1
