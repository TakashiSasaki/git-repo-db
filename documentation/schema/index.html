<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git-repo-db Schema Visualization Workbench</title>
<style>
:root {
  --bg-base: #0f172a;
  --bg-surface: #1e293b;
  --bg-card: #334155;
  --bg-card-hover: #475569;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-sub: #cbd5e1;
  --border: #334155;
  --border-light: #475569;
  --accent: #38bdf8;
  --accent-hover: #0ea5e9;
  --accent-rgb: 56, 189, 248;
  --badge-pk: #facc15;
  --badge-fk: #38bdf8;
  --badge-uk: #4ade80;
  --badge-gen: #c084fc;
  --badge-log: #f472b6;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-base);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 16px;
  color: var(--text-main);
}

.brand-badge {
  background: rgba(var(--accent-rgb), 0.15);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 500;
}

.store-tabs {
  display: flex;
  background: var(--bg-base);
  padding: 3px;
  border-radius: 6px;
  border: 1px solid var(--border);
}

.store-tab {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text-muted);
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.store-tab:hover { color: var(--text-main); }
.store-tab.active {
  background: var(--bg-card);
  color: var(--text-main);
  font-weight: 600;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-box {
  position: relative;
  width: 260px;
}

.search-box input {
  width: 100%;
  background: var(--bg-base);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 6px 10px 6px 30px;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}

.search-box input:focus { border-color: var(--accent); }

.search-icon {
  position: absolute;
  left: 9px;
  top: 8px;
  color: var(--text-muted);
  width: 14px;
  height: 14px;
}

.layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

aside {
  width: 320px;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.group-select {
  width: 100%;
  background: var(--bg-base);
  color: var(--text-main);
  border: 1px solid var(--border);
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 12px;
  outline: none;
}

.sidebar-stats {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}

.table-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0;
}

.table-item {
  padding: 8px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-left: 3px solid transparent;
  transition: all 0.1s ease;
}

.table-item:hover { background: rgba(255, 255, 255, 0.03); }
.table-item.active {
  background: var(--bg-card);
  border-left-color: var(--accent);
}

.table-item-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-main);
}

.table-item-badges {
  display: flex;
  gap: 4px;
}

.mini-badge {
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg-base);
  color: var(--text-muted);
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  background: var(--bg-base);
}

.table-view {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.table-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}

.table-title {
  font-size: 22px;
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 12px;
}

.tag {
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}

.tag-strict { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
.tag-store { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
.tag-group { background: rgba(192, 132, 252, 0.15); color: #c084fc; }

.view-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}

.view-tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

.view-tab:hover { color: var(--text-main); background: var(--bg-surface); }
.view-tab.active { color: var(--accent); background: var(--bg-surface); font-weight: 600; }

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.card-header {
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.02);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

table.data-table th {
  background: rgba(255, 255, 255, 0.02);
  text-align: left;
  padding: 10px 14px;
  color: var(--text-muted);
  font-weight: 500;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}

table.data-table td {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  color: var(--text-sub);
}

table.data-table tr:hover td { background: rgba(255, 255, 255, 0.015); }

.col-name {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-main);
}

.col-type {
  font-family: var(--font-mono);
  color: var(--accent);
  font-size: 12px;
}

.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 600;
  margin-right: 4px;
}

.badge-pk { background: rgba(250, 204, 21, 0.2); color: var(--badge-pk); }
.badge-fk { background: rgba(56, 189, 248, 0.2); color: var(--badge-fk); }
.badge-uk { background: rgba(74, 222, 128, 0.2); color: var(--badge-uk); }
.badge-gen { background: rgba(192, 132, 252, 0.2); color: var(--badge-gen); }
.badge-log { background: rgba(244, 114, 182, 0.2); color: var(--badge-log); }

.link-table {
  color: var(--accent);
  text-decoration: none;
  font-family: var(--font-mono);
  font-weight: 500;
  cursor: pointer;
}
.link-table:hover { text-decoration: underline; }

pre.sql-code {
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-sub);
  background: var(--bg-base);
  overflow-x: auto;
  line-height: 1.6;
}

.graph-container {
  width: 100%;
  min-height: 380px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.graph-header {
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.02);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
}

svg.neighborhood-svg {
  width: 100%;
  height: 100%;
  min-height: 350px;
}

.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}

.store-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.store-card h3 {
  font-size: 18px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.store-card p {
  color: var(--text-muted);
  font-size: 13px;
}

.metric-row {
  display: flex;
  gap: 16px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.metric {
  display: flex;
  flex-direction: column;
}

.metric-val {
  font-size: 20px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--accent);
}

.metric-lbl {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* Responsive */
@media (max-width: 768px) {
  body { overflow-x: hidden; }
  header {
    height: auto;
    flex-wrap: wrap;
    padding: 10px 12px;
    gap: 8px;
  }
  .brand {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .store-tabs {
    overflow-x: auto;
    max-width: 100%;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }
  .header-right {
    width: 100%;
  }
  .search-box {
    width: 100%;
  }
  .layout { flex-direction: column; }
  aside { width: 100%; height: 260px; max-height: 40vh; }
  main { padding: 12px; overflow-x: hidden; }
  .card { overflow-x: auto; }
  .data-table { min-width: 100%; }
}
</style>
</head>

<header>
  <div class="brand">
    <span>git-repo-db</span>
    <span class="brand-badge">Schema Workbench</span>
  </div>
  
  <div class="store-tabs">
    <button class="store-tab active" onclick="setStore('core')">Core (70)</button>

    </div>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-header">
      <select id="groupSelect" class="group-select" onchange="handleGroupChange(this.value)">

      <div class="sidebar-stats">

        <span id="storeBadge">catalog.sqlite3</span>
      </div>
    </div>
    <div class="table-list" id="tableList"></div>
  </aside>

  <main id="mainPanel">
    <div id="contentArea"></div>
  </main>
</div>

e":"payload_quarantine","source_columns":["unresolved_payload_id"],"target_columns":["unresolved_payload_id"],"is_composite":false,"on_update":"RESTRICT","on_delete":"RESTRICT","constraint_id":0}]}},"views":{"active_identity_relations":{"name":"active_identity_relations","sql":"CREATE VIEW active_identity_relations AS SELECT r.* FROM identity_relations r WHERE NOT EXISTS(SELECT 1 FROM identity_relation_cancellations c WHERE c.relation_uuidv4=r.relation_uuidv4) AND NOT EXISTS(SELECT 1 FROM identity_relation_staging s WHERE s.record_uuidv4=r.relation_uuidv4 OR (s.kind='cancellation' AND json_extract(s.record_json,'$.relation_uuidv4')=r.relation_uuidv4))","columns":["relation_uuidv4","entity_kind","left_repository_uuidv4","right_repository_uuidv4","left_service_instance_uuidv4","right_service_instance_uuidv4","evidence_json","asserted_at_us"],"sql_sha256":"90abaa6abf85c2c0faa2387435b5852c1d1c9cc1c83dc839c7a8327fcfb21053"},"available_git_acquisitions":{"name":"available_git_acquisitions","sql":"CREATE VIEW available_git_acquisitions AS\n SELECT a.* FROM git_acquisitions a WHERE a.roots_manifest IS NOT NULL\n -- This establishes availability once per exact source object. All remaining\n -- closure checks use indexed identities/membership, avoiding repeated decoding.\n AND NOT EXISTS(SELECT 1 FROM repository_object_sources r WHERE r.git_acquisition_id=a.git_acquisition_id AND NOT EXISTS(SELECT 1 FROM available_git_objects g WHERE g.git_object_id=r.git_object_id))\n AND NOT EXISTS(SELECT 1 FROM json_each(a.roots_manifest) ref WHERE NOT EXISTS(SELECT 1 FROM git_objects g JOIN repository_object_sources r USING(git_object_id) WHERE r.git_acquisition_id=a.git_acquisition_id AND g.object_format=a.object_format AND g.oid=repo_catalog_git_oid_bytes(a.object_format,json_extract(ref.value,'$.oid')) AND g.type=json_extract(ref.value,'$.type')))\n -- A captured peel is the final non-tag target of this exact canonical tag\n -- chain. Merely retaining an unrelated object with the claimed OID proves\n -- nothing. UNION terminates even if damaged retained relations contain a cycle.\n AND NOT EXISTS(SELECT 1 FROM json_each(a.roots_manifest) ref WHERE\n  (json_extract(ref.value,'$.type')<>'tag' AND json_extract(ref.value,'$.peeled') IS NOT NULL)\n  OR (json_extract(ref.value,'$.type')='tag' AND NOT EXISTS(\n   WITH RECURSIVE peel(git_object_id,oid,type) AS (\n    SELECT g.git_object_id,g.oid,g.type FROM git_objects g WHERE g.object_format=a.object_format AND g.oid=repo_catalog_git_oid_bytes(a.object_format,json_extract(ref.value,'$.oid')) AND g.type='tag'\n    UNION\n    SELECT g.git_object_id,g.oid,g.type FROM peel p JOIN tag_objects t ON t.git_object_id=p.git_object_id JOIN git_objects g ON g.object_format=t.target_format AND g.oid=t.target_oid AND g.type=t.target_type WHERE p.type='tag'\n   ) SELECT 1 FROM peel WHERE type<>'tag' AND oid=repo_catalog_git_oid_bytes(a.object_format,json_extract(ref.value,'$.peeled'))\n  )))\n AND NOT EXISTS(SELECT 1 FROM acquisition_roots root WHERE root.git_acquisition_id=a.git_acquisition_id AND NOT EXISTS(SELECT 1 FROM git_objects g JOIN repository_object_sources r USING(git_object_id) WHERE r.git_acquisition_id=a.git_acquisition_id AND g.object_format=root.object_format AND g.oid=root.oid))\n AND NOT EXISTS(SELECT 1 FROM repository_object_sources source JOIN commits c ON c.git_object_id=source.git_object_id WHERE source.git_acquisition_id=a.git_acquisition_id AND NOT EXISTS(SELECT 1 FROM git_objects g JOIN repository_object_sources r USING(git_object_id) WHERE r.git_acquisition_id=a.git_acquisition_id AND g.object_format=c.tree_format AND g.oid=c.tree_oid AND g.type='tree'))\n AND NOT EXISTS(SELECT 1 FROM repository_object_sources source JOIN commit_parents p ON p.commit_git_object_id=source.git_object_id WHERE source.git_acquisition_id=a.git_acquisition_id AND NOT EXISTS(SELECT 1 FROM git_objects g JOIN repository_object_sources r USING(git_object_id) WHERE r.git_acquisition_id=a.git_acquisition_id AND g.object_format=p.parent_format AND g.oid=p.parent_oid AND g.type='commit'))\n AND NOT EXISTS(SELECT 1 FROM repository_object_sources source JOIN tree_entries e ON e.tree_git_object_id=source.git_object_id WHERE source.git_acquisition_id=a.git_acquisition_id AND e.mode<>57344 AND NOT EXISTS(SELECT 1 FROM git_objects g JOIN repository_object_sources r USING(git_object_id) WHERE r.git_acquisition_id=a.git_acquisition_id AND g.object_format=e.child_format AND g.oid=e.child_oid AND g.type=CASE e.mode WHEN 16384 THEN 'tree' ELSE 'blob' END))\n AND NOT EXISTS(SELECT 1 FROM repository_object_sources source JOIN tag_objects t ON t.git_object_id=source.git_object_id WHERE source.git_acquisition_id=a.git_acquisition_id AND NOT EXISTS(SELECT 1 FROM git_objects g JOIN repository_object_sources r USING(git_object_id) WHERE r.git_acquisition_id=a.git_acquisition_id AND g.object_format=t.target_format AND g.oid=t.target_oid AND g.type=t.target_type))","columns":["git_acquisition_id","repository_uuidv4","repository_endpoint_id","endpoint_url","object_format","refs_observed_at_us","source_id","kind","started_at_us","observed_at_us","request","roots_manifest"],"sql_sha256":"bb580848b3238ef82172f95c66ed798d4cb46aee48b54815bec171970e7ab392"},"available_git_objects":{"name":"available_git_objects","sql":"CREATE VIEW available_git_objects AS\n SELECT g.* FROM git_objects g JOIN git_object_payloads p USING(git_object_id) JOIN stored_bytes b ON b.sha256=p.payload_sha256\n WHERE g.verified=1 AND g.size=b.byte_length AND NOT EXISTS(SELECT 1 FROM payload_quarantine q WHERE q.sha256=p.payload_sha256)\n AND repo_catalog_git_object_identity_valid(g.object_format,hex(g.oid),g.type,g.size,b.body,p.payload_sha256)=1\n AND NOT EXISTS(SELECT 1 FROM commits c WHERE c.git_object_id=g.git_object_id AND g.type<>'commit')\n AND NOT EXISTS(SELECT 1 FROM commit_parents c WHERE c.commit_git_object_id=g.git_object_id AND g.type<>'commit')\n AND NOT EXISTS(SELECT 1 FROM tree_objects t WHERE t.git_object_id=g.git_object_id AND g.type<>'tree')\n AND NOT EXISTS(SELECT 1 FROM tree_entries t WHERE t.tree_git_object_id=g.git_object_id AND g.type<>'tree')\n AND NOT EXISTS(SELECT 1 FROM tag_objects t WHERE t.git_object_id=g.git_object_id AND g.type<>'tag')\n AND NOT EXISTS(SELECT 1 FROM blob_content_map m WHERE m.git_object_id=g.git_object_id AND g.type<>'blob')\n AND ((g.type='blob' AND EXISTS(SELECT 1 FROM blob_content_map m JOIN contents c USING(content_id) WHERE m.git_object_id=g.git_object_id AND c.byte_length=g.size\n AND NOT EXISTS(SELECT 1 FROM content_digests d WHERE d.content_id=m.content_id AND repo_catalog_git_content_digest_valid(b.body,d.algorithm,d.digest)<>1)))\n OR (g.type='commit' AND EXISTS(SELECT 1 FROM commits c WHERE c.git_object_id=g.git_object_id AND c.tree_format=g.object_format\n AND repo_catalog_git_commit_shape_valid(g.object_format,b.body,c.tree_oid,c.tree_header_offset,c.parent_count,c.raw_headers,c.raw_message)=1\n AND c.parent_count=(SELECT count(*) FROM commit_parents p WHERE p.commit_git_object_id=c.git_object_id)\n AND (c.tree_git_object_id IS NULL OR EXISTS(SELECT 1 FROM git_objects target WHERE target.git_object_id=c.tree_git_object_id AND target.verified=1 AND EXISTS(SELECT 1 FROM git_object_payloads raw WHERE raw.git_object_id=target.git_object_id) AND target.object_format=c.tree_format AND target.oid=c.tree_oid AND target.type='tree'))\n AND NOT EXISTS(SELECT 1 FROM commit_parents p WHERE p.commit_git_object_id=c.git_object_id AND (\n  p.parent_format<>g.object_format OR p.parent_ordinal>=c.parent_count\n  OR substr(c.raw_headers,p.parent_header_offset+1,7)<>CAST('parent ' AS BLOB)\n  OR lower(CAST(substr(c.raw_headers,p.parent_header_offset+8,length(p.parent_oid)*2) AS TEXT))<>lower(hex(p.parent_oid))\n  OR (p.parent_header_offset<>0 AND substr(c.raw_headers,p.parent_header_offset,1)<>X'0a')\n  OR (length(c.raw_headers)<>p.parent_header_offset+7+length(p.parent_oid)*2 AND substr(c.raw_headers,p.parent_header_offset+8+length(p.parent_oid)*2,1)<>X'0a')\n  OR EXISTS(SELECT 1 FROM commit_parents prior WHERE prior.commit_git_object_id=p.commit_git_object_id AND prior.parent_ordinal=p.parent_ordinal-1 AND prior.parent_header_offset>=p.parent_header_offset)\n  OR (p.parent_git_object_id IS NOT NULL AND NOT EXISTS(SELECT 1 FROM git_objects target WHERE target.git_object_id=p.parent_git_object_id AND target.verified=1 AND EXISTS(SELECT 1 FROM git_object_payloads raw WHERE raw.git_object_id=target.git_object_id) AND target.object_format=p.parent_format AND target.oid=p.parent_oid AND target.type='commit'))\n ))))\n OR (g.type='tree' AND repo_catalog_git_tree_shape_valid(g.object_format,b.body)=1 AND EXISTS(SELECT 1 FROM tree_objects t WHERE t.git_object_id=g.git_object_id AND t.entry_count=(SELECT count(*) FROM tree_entries e WHERE e.tree_git_object_id=g.git_object_id) AND g.size=(SELECT coalesce(sum(e.entry_length),0) FROM tree_entries e WHERE e.tree_git_object_id=g.git_object_id) AND NOT EXISTS(SELECT 1 FROM (SELECT entry_offset,lag(entry_offset+entry_length,1,0) OVER (ORDER BY entry_offset) AS expected_offset FROM tree_entries e WHERE e.tree_git_object_id=g.git_object_id) WHERE entry_offset<>expected_offset)\n AND NOT EXISTS(SELECT 1 FROM tree_entries e WHERE e.tree_git_object_id=g.git_object_id AND (\n  e.child_format<>g.object_format OR instr(e.raw_name,X'00')<>0\n  OR ltrim(CAST(substr(b.body,e.entry_offset+1,e.entry_length-length(e.raw_name)-length(e.child_oid)-2) AS TEXT),'0')<>CASE e.mode WHEN 16384 THEN '40000' WHEN 33188 THEN '100644' WHEN 33261 THEN '100755' WHEN 40960 THEN '120000' WHEN 57344 THEN '160000' END\n  OR substr(b.body,e.entry_offset+1,e.entry_length)<>CAST(substr(b.body,e.entry_offset+1,e.entry_length-length(e.raw_name)-length(e.child_oid)-2)||' '||e.raw_name||char(0)||e.child_oid AS BLOB)\n  OR (e.child_git_object_id IS NOT NULL AND NOT EXISTS(SELECT 1 FROM git_objects target WHERE target.git_object_id=e.child_git_object_id AND target.verified=1 AND EXISTS(SELECT 1 FROM git_object_payloads raw WHERE raw.git_object_id=target.git_object_id) AND target.object_format=e.child_format AND target.oid=e.child_oid AND target.type=CASE e.mode WHEN 16384 THEN 'tree' ELSE 'blob' END))\n ))))\n OR (g.type='tag' AND EXISTS(SELECT 1 FROM tag_objects t WHERE t.git_object_id=g.git_object_id AND t.target_format=g.object_format AND t.raw_payload=b.body\n AND repo_catalog_git_tag_shape_valid(g.object_format,b.body,t.target_oid,t.target_type)=1\n AND (t.target_git_object_id IS NULL OR EXISTS(SELECT 1 FROM git_objects target WHERE target.git_object_id=t.target_git_object_id AND target.verified=1 AND EXISTS(SELECT 1 FROM git_object_payloads raw WHERE raw.git_object_id=target.git_object_id) AND target.object_format=t.target_format AND target.oid=t.target_oid AND target.type=t.target_type))\n )))","columns":["git_object_id","object_format","oid","type","size","verified"],"sql_sha256":"12c8a25107bb8de63cae7d80564dcf004c327be19228aa70c4fa08770e0c9ff2"},"available_snapshots":{"name":"available_snapshots","sql":"CREATE VIEW available_snapshots AS SELECT s.* FROM valid_ref_captures s WHERE s.complete=1","columns":["snapshot_id","git_acquisition_id","repository_uuidv4","predecessor_snapshot_id","complete","generation","created_at_us"],"sql_sha256":"1833d01d68322654f33ede71764df68d5e091a215c2246b97b64ae4e5b72c8a7"},"current_coverage":{"name":"current_coverage","sql":"CREATE VIEW current_coverage AS\nSELECT s.coverage_scope_id,s.repository_uuidv4,s.change_request_id,s.kind,\n       max(c.observed_at_us) AS observed_at_us,\n       CASE WHEN count(b.coverage_claim_id)>0 THEN 'conflict'\n            WHEN count(DISTINCT CASE WHEN c.coverage_state!='unknown' THEN c.coverage_state END)>1 THEN 'conflict'\n            ELSE coalesce(max(CASE WHEN c.coverage_state!='unknown' THEN c.coverage_state END),'unknown') END AS coverage_state,\n       count(c.coverage_claim_id) AS claim_count\nFROM coverage_scopes s\nLEFT JOIN coverage_claims c ON c.coverage_scope_id=s.coverage_scope_id\n AND c.observed_at_us=(SELECT max(latest.observed_at_us) FROM coverage_claims latest WHERE latest.coverage_scope_id=s.coverage_scope_id)\nLEFT JOIN exchange_blocked_coverage_claims b ON b.coverage_claim_id=c.coverage_claim_id\nGROUP BY s.coverage_scope_id","columns":["coverage_scope_id","repository_uuidv4","change_request_id","kind","observed_at_us","coverage_state","claim_count"],"sql_sha256":"2211055d4d9a6aa544637d4cc903b129581fc85a8e9394cc1b10ab8bf182c4bc"},"current_resource_diagnostics":{"name":"current_resource_diagnostics","sql":"CREATE VIEW current_resource_diagnostics AS\n SELECT table_name,record_key,repository_uuidv4,reason,record_json\n FROM exchange_staging WHERE table_name IN ('issue_resources','review_resources','change_request_state','document_state','review_thread_state','source_repositories') AND reason LIKE 'current_state:%'","columns":["table_name","record_key","repository_uuidv4","reason","record_json"],"sql_sha256":"00dd0cbdfdc9613efd3771f871f8514e9b7e7306a71f96767c4d20e24c9dda3e"},"current_snapshots":{"name":"current_snapshots","sql":"CREATE VIEW current_snapshots AS\n WITH heads AS (SELECT s.* FROM snapshots s WHERE s.complete=1 AND NOT EXISTS(SELECT 1 FROM snapshots n WHERE n.predecessor_snapshot_id=s.snapshot_id AND n.complete=1))\n SELECT a.* FROM available_snapshots a JOIN heads h USING(snapshot_id)\n WHERE (SELECT count(*) FROM heads x WHERE x.repository_uuidv4=a.repository_uuidv4)=1","columns":["snapshot_id","git_acquisition_id","repository_uuidv4","predecessor_snapshot_id","complete","generation","created_at_us"],"sql_sha256":"c1a9a33b1de8259d9d9c760b4439a0ef4a05a6f007d42f2faff33f9c40552b8f"},"eligible_change_request_state":{"name":"eligible_change_request_state","sql":"CREATE VIEW eligible_change_request_state AS SELECT r.* FROM change_request_state r WHERE NOT EXISTS(SELECT 1 FROM exchange_staging d WHERE d.table_name='change_request_state' AND d.reason='current_state:conflict' AND json_extract(d.record_json,'$.change_request_id')=r.change_request_id) let currentStore = "core";
let currentGroup = "all";
let currentTable = null;
let currentViewTab = "columns";
let searchQuery = "";

function init() {
  populateGroupDropdown();
  renderSidebarTableList();
  // Select first table in core
  const firstTable = Object.keys(SCHEMA_DATA.stores[currentStore].tables).sort()[0];
  selectTable(firstTable);
}

function setStore(storeSlug) {
  currentStore = storeSlug;
  currentGroup = "all";
  currentViewTab = "columns";
  
  document.querySelectorAll('.store-tab').forEach(tab => {
    tab.classList.toggle('active', tab.textContent.toLowerCase().includes(storeSlug));
  });
  
  populateGroupDropdown();
  renderSidebarTableList();
  const firstTable = Object.keys(SCHEMA_DATA.stores[currentStore].tables).sort()[0];
  selectTable(firstTable);
}

function populateGroupDropdown() {
  const select = document.getElementById("groupSelect");
  select.innerHTML = '<option value="all">All Functional Groups</option>';
  
  if (currentStore === "core") {
    const groupCounts = {};
    Object.values(SCHEMA_DATA.stores.core.tables).forEach(t => {
      groupCounts[t.group] = (groupCounts[t.group] || 0) + 1;
    });
    
    Object.keys(groupCounts).sort().forEach(g => {
      const meta = SCHEMA_DATA.group_metadata[g] || { title: g };
      const opt = document.createElement("option");
      opt.value = g;
      opt.textContent = `${meta.title} (${groupCounts[g]})`;
      select.appendChild(opt);
    });
    select.style.display = "block";
  } else {
    select.style.display = "none";
  }
  document.getElementById("storeBadge").textContent = SCHEMA_DATA.stores[currentStore].db_filename;
}

function handleGroupChange(group) {
  currentGroup = group;
  renderSidebarTableList();
}

function handleSearch(query) {
  searchQuery = query.trim().toLowerCase();
  renderSidebarTableList();
}

function renderSidebarTableList() {
  const listEl = document.getElementById("tableList");
  listEl.innerHTML = "";
  
  const tables = SCHEMA_DATA.stores[currentStore].tables;
  const filtered = Object.keys(tables).sort().filter(tName => {
    const t = tables[tName];
    if (currentGroup !== "all" && t.group !== currentGroup) return false;
    if (!searchQuery) return true;
    
    // Match table name
    if (tName.toLowerCase().includes(searchQuery)) return true;
    // Match column names
    return t.columns.some(c => c.name.toLowerCase().includes(searchQuery));
  });

  document.getElementById("filteredCount").textContent = `${filtered.length} tables`;

  filtered.forEach(tName => {
    const t = tables[tName];
    const item = document.createElement("div");
    item.className = `table-item ${currentTable === tName ? "active" : ""}`;
    item.onclick = () => selectTable(tName);
    
    const fkCount = t.foreign_keys.length;
    item.innerHTML = `
      <span class="table-item-name">${tName}</span>
      <div class="table-item-badges">
        <span class="mini-badge">${t.columns.length}c</span>
        ${fkCount > 0 ? `<span class="mini-badge" style="color:var(--accent)">${fkCount}fk</span>` : ""}
      </div>
    `;
    listEl.appendChild(item);
  });
}

function selectTable(tName) {
  currentTable = tName;
  
  // Highlight in sidebar
  document.querySelectorAll('.table-item').forEach(el => {
    const name = el.querySelector('.table-item-name').textContent;
    el.classList.toggle('active', name === tName);
  });
  
  renderTableDetails();
}

function setViewTab(tab) {
  currentViewTab = tab;
  renderTableDetails();
}

function renderTableDetails() {
  if (!currentTable) return;
  const t = SCHEMA_DATA.stores[currentStore].tables[currentTable];
  if (!t) return;

  const contentArea = document.getElementById("contentArea");
  
  let tabContent = "";
  if (currentViewTab === "columns") {
    tabContent = renderColumnsTab(t);
  } else if (currentViewTab === "relationships") {
    tabContent = renderRelationshipsTab(t);
  } else if (currentViewTab === "graph") {
    tabContent = renderGraphTab(t);
  } else if (currentViewTab === "indexes") {
    tabContent = renderIndexesTab(t);
  } else if (currentViewTab === "triggers") {
    tabContent = renderTriggersTab(t);
  } else if (currentViewTab === "sql") {
    tabContent = renderSqlTab(t);
  }

  contentArea.innerHTML = `
    <div class="table-view">
      <div class="table-header">
        <div>
          <div class="table-title">
            ${t.name}
            ${t.is_strict ? '<span class="tag tag-strict">STRICT</span>' : ''}
          </div>
          <div style="margin-top:6px; display:flex; gap:8px;">
            <span class="tag tag-store">${SCHEMA_DATA.stores[currentStore].title}</span>
            <span class="tag tag-group">${t.group_title}</span>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12px; color:var(--text-muted); font-family:var(--font-mono)">
            Schema Version ${SCHEMA_DATA.stores[currentStore].schema_version}
          </div>
        </div>
      </div>

      <div class="view-tabs">
        <button class="view-tab ${currentViewTab==='columns'?'active':''}" onclick="setViewTab('columns')">Columns (${t.columns.length})</button>
        <button class="view-tab ${currentViewTab==='relationships'?'active':''}" onclick="setViewTab('relationships')">Relationships (${t.foreign_keys.length + t.incoming_foreign_keys.length})</button>
        <button class="view-tab ${currentViewTab==='graph'?'active':''}" onclick="setViewTab('graph')">Neighborhood Graph</button>
        <button class="view-tab ${currentViewTab==='indexes'?'active':''}" onclick="setViewTab('indexes')">Indexes (${t.indexes.length + t.unique_constraints.length})</button>
        <button class="view-tab ${currentViewTab==='triggers'?'active':''}" onclick="setViewTab('triggers')">Triggers (${t.triggers.length})</button>
        <button class="view-tab ${currentViewTab==='sql'?'active':''}" onclick="setViewTab('sql')">DDL SQL</button>
      </div>

      ${tabContent}
    </div>
  `;

  if (currentViewTab === "graph") {
    drawNeighborhoodSvg(t);
  }
}

function renderColumnsTab(t) {
  let rows = "";
  t.columns.forEach(col => {
    let badges = "";
    if (col.is_pk) badges += `<span class="badge badge-pk">PK</span>`;
    
    // FK check
    const isFk = t.foreign_keys.some(fk => fk.from_columns.includes(col.name));
    if (isFk) badges += `<span class="badge badge-fk">FK</span>`;
    
    // Unique check
    const isUk = t.unique_constraints.some(u => u.columns.length === 1 && u.columns[0] === col.name && !u.partial);
    if (isUk && !col.is_pk) badges += `<span class="badge badge-uk">UK</span>`;
    
    if (col.is_generated) badges += `<span class="badge badge-gen">${col.generation_type}</span>`;

    const defVal = col.default_value !== null ? `<code>${escapeHtml(col.default_value)}</code>` : `<span style="color:var(--text-muted)">NULL</span>`;
    const notNull = col.notnull ? "YES" : (col.is_pk ? `<span style="color:var(--accent); font-weight:600" title="Primary Key semantics (rowid/PK)">PK</span>` : `<span style="color:var(--text-muted)">NO</span>`);

    rows += `
      <tr>
        <td class="col-name">${col.name}</td>
        <td class="col-type">${col.type}</td>
        <td>${badges || "-"}</td>
        <td>${notNull}</td>
        <td>${defVal}</td>
      </tr>
    `;
  });

  return `
    <div class="card">
      <div class="card-header">
        <span>Columns Definition</span>
        <span style="font-family:var(--font-mono); font-size:12px; color:var(--text-muted)">${t.columns.length} columns</span>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Column Name</th>
            <th>Type</th>
            <th>Constraints</th>
            <th>Not Null</th>
            <th>Default Value</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderRelationshipsTab(t) {
  let outRows = "";
  t.foreign_keys.forEach(fk => {
    outRows += `
      <tr>
        <td>${fk.from_columns.map(c => `<code>${c}</code>`).join(", ")}</td>
        <td><a class="link-table" onclick="navigateTable('${fk.target_table}')">${fk.target_table}</a></td>
        <td>${fk.to_columns.map(c => `<code>${c}</code>`).join(", ")}</td>
        <td style="font-family:var(--font-mono); font-size:11px">ON UPDATE ${fk.on_update}<br>ON DELETE ${fk.on_delete}</td>
      </tr>
    `;
  });

  let inRows = "";
  t.incoming_foreign_keys.forEach(ifk => {
    inRows += `
      <tr>
        <td><a class="link-table" onclick="navigateTable('${ifk.source_table}')">${ifk.source_table}</a></td>
        <td>${ifk.source_columns.map(c => `<code>${c}</code>`).join(", ")}</td>
        <td>${ifk.target_columns.map(c => `<code>${c}</code>`).join(", ")}</td>
        <td style="font-family:var(--font-mono); font-size:11px">ON UPDATE ${ifk.on_update}<br>ON DELETE ${ifk.on_delete}</td>
      </tr>
    `;
  });

  let logRows = "";
  const outLog = t.logical_outgoing || [];
  const inLog = t.logical_incoming || [];
  [...outLog, ...inLog].forEach(l => {
    const isOut = outLog.includes(l);
    logRows += `
      <tr>

function drawNeighborhoodSvg(t) {
  const svg = document.getElementById("neighborhoodSvg");
  if (!svg) return;
  svg.innerHTML = "";

  const upstream = t.foreign_keys.map(fk => ({
    name: fk.target_table,
    label: fk.from_columns.join(", ") + " -> " + fk.to_columns.join(", "),
    logical: false
  }));
  (t.logical_outgoing || []).forEach(l => {
    upstream.push({
      name: l.target_table,
      label: l.source_columns.join(", ") + " -> " + l.target_columns.join(", "),
      logical: true
    });
  });

  const downstream = t.incoming_foreign_keys.map(ifk => ({
    name: ifk.source_table,
    label: ifk.source_columns.join(", ") + " -> " + ifk.target_columns.join(", "),
    logical: false
  }));
  (t.logical_incoming || []).forEach(l => {
    downstream.push({
      name: l.source_table,
      label: l.source_columns.join(", ") + " -> " + l.target_columns.join(", "),
      logical: true
    });
  });

  const maxNodes = Math.max(upstream.length, downstream.length, 1);
  const rowHeight = 60;
  const height = Math.max(360, maxNodes * rowHeight + 80);
  const width = svg.clientWidth || 900;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // Markers
  svg.innerHTML += `
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
      </marker>
      <marker id="arrow-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6"/>
      </marker>
    </defs>
  `;

  const centerY = height / 2;
  const centerX = width / 2;
  const cardW = 180;
  const cardH = 36;

  // Draw Center Node
  drawNode(svg, centerX - cardW/2, centerY - cardH/2, cardW, cardH, t.name, true);

  // Draw Upstream (Left)
  const upStartY = centerY - ((upstream.length - 1) * rowHeight) / 2;
  upstream.forEach((u, i) => {
    const uy = upStartY + i * rowHeight;
    const ux = 80;
    drawNode(svg, ux, uy - cardH/2, cardW, cardH, u.name, false, () => navigateTable(u.name));
    drawEdge(svg, centerX - cardW/2, centerY, ux + cardW, uy, u.label, u.logical);
  });

  // Draw Downstream (Right)
  const downStartY = centerY - ((downstream.length - 1) * rowHeight) / 2;
  downstream.forEach((d, i) => {
    const dy = downStartY + i * rowHeight;
    const dx = width - 80 - cardW;
    drawNode(svg, dx, dy - cardH/2, cardW, cardH, d.name, false, () => navigateTable(d.name));
    drawEdge(svg, dx, dy, centerX + cardW/2, centerY, d.label, d.logical);
  });
}

function drawNode(svg, x, y, w, h, text, isCenter, onClick) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.style.cursor = isCenter ? "default" : "pointer";
  if (onClick) g.onclick = onClick;

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("x", x);
  rect.setAttribute("y", y);
  rect.setAttribute("width", w);
  rect.setAttribute("height", h);
  rect.setAttribute("rx", "6");
  rect.setAttribute("fill", isCenter ? "#1e293b" : "#334155");
  rect.setAttribute("stroke", isCenter ? "#38bdf8" : "#475569");
  rect.setAttribute("stroke-width", isCenter ? "2" : "1");

  const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
  label.setAttribute("x", x + w / 2);
  label.setAttribute("y", y + h / 2 + 4);
  label.setAttribute("text-anchor", "middle");
  label.setAttribute("fill", isCenter ? "#f8fafc" : "#cbd5e1");
  label.setAttribute("font-family", "monospace");
  label.setAttribute("font-size", "12");
  label.setAttribute("font-weight", isCenter ? "700" : "500");
  label.textContent = text;

  g.appendChild(rect);
  g.appendChild(label);
  svg.appendChild(g);
}

function drawEdge(svg, x1, y1, x2, y2, labelText, isLogical) {
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const dx = (x2 - x1) * 0.5;
  const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  path.setAttribute("d", d);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", isLogical ? "#f472b6" : "#38bdf8");
  path.setAttribute("stroke-width", "1.5");
  if (isLogical) path.setAttribute("stroke-dasharray", "5,5");
  path.setAttribute("marker-end", isLogical ? "url(#arrow-log)" : "url(#arrow)");

  const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
  title.textContent = labelText;
  path.appendChild(title);

  svg.appendChild(path);
}

function navigateTable(tName) {
  // Check which store has this table
  for (const [sSlug, sData] of Object.entries(SCHEMA_DATA.stores)) {
    if (sData.tables[tName]) {
      if (currentStore !== sSlug) {
        setStore(sSlug);
      }
      selectTable(tName);
      return;
    }
  }
}
