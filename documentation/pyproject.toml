[project]
name = "git-repo-db-documentation"
version = "0.0.0"
description = "Isolated, unpublished documentation preparation tools"
requires-python = ">=3.12"
dependencies = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
