<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Core Store Gradients -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="coreTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Operational Store Gradients -->
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="opTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Search Store Gradients -->
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="searchTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Git Line Gradient -->
    <linearGradient id="gitLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ambient Shadow Filter -->
    <filter id="diskShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full-Bleed Square Background for Maskable Icon Spec -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner Content scaled into 80% safe zone circle -->
  <g transform="translate(256, 256) scale(0.80) translate(-256, -256)">
    <!-- Subtle Ambient Glow Orbs -->
    <circle cx="350" cy="240" r="130" fill="#0284c7" opacity="0.15" />
    <circle cx="130" cy="250" r="90" fill="#818cf8" opacity="0.12" />

    <!-- Data Stream Bridge Connectors (Git to Stores) -->
    <g opacity="0.80">
      <path d="M 125,145 C 195,145 210,165 255,165" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="6,4" fill="none" />
      <path d="M 185,250 C 215,250 225,245 255,245" stroke="#a855f7" stroke-width="3.5" stroke-dasharray="6,4" fill="none" />
      <path d="M 125,320 C 190,320 215,315 255,315" stroke="#34d399" stroke-width="3.5" stroke-dasharray="6,4" fill="none" />
    </g>

    <!-- Git DAG Branch Graph -->
    <g>
      <!-- Trunk Line -->
      <path d="M 125,100 L 125,370" stroke="url(#gitLineGrad)" stroke-width="7" stroke-linecap="round" />

      <!-- Feature Branch Line -->
      <path d="M 125,185 C 185,185 185,250 185,250 C 185,250 185,315 125,315" stroke="#c084fc" stroke-width="6" stroke-linecap="round" fill="none" />

      <!-- Commit Nodes -->
      <circle cx="125" cy="115" r="11" fill="#38bdf8" stroke="#0f172a" stroke-width="3.5" filter="url(#glow)" />
      <circle cx="125" cy="185" r="12" fill="#818cf8" stroke="#0f172a" stroke-width="3.5" />
      <circle cx="185" cy="250" r="14" fill="#c084fc" stroke="#0f172a" stroke-width="4" filter="url(#glow)" />
      <circle cx="125" cy="315" r="14" fill="#34d399" stroke="#0f172a" stroke-width="4" filter="url(#glow)" />
      <circle cx="125" cy="370" r="11" fill="#38bdf8" stroke="#0f172a" stroke-width="3.5" />
    </g>

    <!-- Three-Store Database Cylinders Stack -->
    <g filter="url(#diskShadow)">
      <!-- 1. Search Store (Bottom) -->
      <g>
        <path d="M 255,305 A 95,23 0 0,0 445,305 L 445,335 A 95,23 0 0,1 255,335 Z" fill="url(#searchGrad)" stroke="#10b981" stroke-width="1.5" />
        <ellipse cx="350" cy="305" rx="95" ry="23" fill="url(#searchTop)" stroke="#34d399" stroke-width="1.5" />
        <text x="350" y="311" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#064e3b" letter-spacing="1.5">SEARCH (FTS5)</text>
        <text x="350" y="328" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a7f3d0" font-weight="600">SCHEMA 1 • 4 TABLES</text>
      </g>

      <!-- 2. Operational Store (Middle) -->
      <g>
        <path d="M 255,235 A 95,23 0 0,0 445,235 L 445,265 A 95,23 0 0,1 255,265 Z" fill="url(#opGrad)" stroke="#6366f1" stroke-width="1.5" />
        <ellipse cx="350" cy="235" rx="95" ry="23" fill="url(#opTop)" stroke="#818cf8" stroke-width="1.5" />
        <text x="350" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#1e1b4b" letter-spacing="1.5">OPERATIONAL</text>
        <text x="350" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c7d2fe" font-weight="600">SCHEMA 1 • 10 TABLES</text>
      </g>

      <!-- 3. Core Store (Top) -->
      <g>
        <path d="M 255,155 A 95,23 0 0,0 445,155 L 445,188 A 95,23 0 0,1 255,188 Z" fill="url(#coreGrad)" stroke="#0284c7" stroke-width="1.5" />
        <ellipse cx="350" cy="155" rx="95" ry="23" fill="url(#coreTop)" stroke="#38bdf8" stroke-width="1.5" />
        <text x="350" y="161" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#082f49" letter-spacing="1.5">CORE STORE</text>
        <text x="350" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#bae6fd" font-weight="600">SCHEMA 21 • 70 TABLES</text>
      </g>
    </g>

    <!-- Branding Wordmark -->
    <g>
      <text x="256" y="432" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="800" fill="#f8fafc" letter-spacing="2">git-repo-db</text>
      <text x="256" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2.5">THREE-STORE ARCHITECTURE</text>
    </g>
  </g>
</svg>
